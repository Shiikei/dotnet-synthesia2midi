services:
  synthesia2midi:
    build: .
    container_name: dotnet-synthesia2midi
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      TLS_MODE: auto
      TLS_PFX_PATH: /certs/cert.pfx
      TLS_PFX_PASSWORD: ""
      TLS_CERT_PATH: /certs/cert.pem
      TLS_KEY_PATH: /certs/key.pem
      DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./certs:/certs:ro
